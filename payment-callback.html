<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حالة الدفع — Beauty Life</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
<style>
  body{font-family:var(--font);background:radial-gradient(1200px 600px at 80% -10%,var(--navy-800),var(--navy-950));min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:16px;}
  .card{background:#fff;max-width:520px;width:100%;padding:32px 26px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);text-align:center;border-top:4px solid var(--gold-500);}
  .mini-brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:16px;text-align:right;}
  .mini-brand .logo-mark{width:56px;height:56px;border-radius:16px;}
  .mini-brand .logo-name{font-size:1.1rem;}
  .mini-brand .logo-tag{font-size:.64rem;}
  .ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2.3rem;color:#fff;}
  .ok{background:linear-gradient(135deg,#10b981,var(--success));}
  .fail{background:linear-gradient(135deg,#ef4444,var(--danger));}
  .wait{background:linear-gradient(135deg,var(--gold-500),var(--gold-700));}
  h1{margin:6px 0 8px;font-weight:900;color:var(--navy-900);font-size:1.45rem;}
  p{color:var(--gray-700);line-height:1.8;}
  .num{font-family:monospace;font-size:1.25rem;font-weight:900;color:var(--navy-900);background:var(--gold-100);padding:8px 14px;border-radius:10px;display:inline-block;margin:8px 0;}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .btns .btn{padding:12px 22px;border-radius:12px;font-weight:800;}
</style>
</head>
<body>
<main class="card" id="box" aria-live="polite">
  <a href="index.html" class="mini-brand" aria-label="Beauty Life Home">
    <div class="logo-mark logo-image-mark"><img src="assets/company-logo.png" alt="Beauty Life Logo" class="brand-logo-img"></div>
    <div class="logo-text">
      <div class="logo-name">Beauty <span>Life</span></div>
      <div class="logo-tag">Medical Aesthetic</div>
    </div>
  </a>
  <div class="ring wait" id="ring"><i class="fas fa-spinner fa-spin"></i></div>
  <h1 id="title">جاري التحقق من عملية الدفع...</h1>
  <p id="msg">لحظات من فضلك، بنأكد الدفع من السيرفر.</p>
  <div class="num" id="ord"></div>
  <div class="btns">
    <a href="track.html" class="btn btn-gold"><i class="fas fa-truck"></i> تتبع طلبك</a>
    <a href="index.html" class="btn btn-ghost">الرئيسية</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" data-sb-sdk="1"></script>
<script src="js/supabase-init.js"></script>
<script>
/* The payment result is read ONLY from the database (payment_status RPC, needs the order's secret token).
   URL parameters such as ?status=success are ignored — they can be forged. */
(function () {
  var qs = new URLSearchParams(location.search);
  var orderNum = qs.get('order') || '';
  var token = qs.get('t') || '';
  var ring = document.getElementById('ring'), title = document.getElementById('title'), msg = document.getElementById('msg');
  document.getElementById('ord').textContent = orderNum ? ('رقم الطلب: ' + orderNum) : '';

  function show(kind, t, m, icon) { ring.className = 'ring ' + kind; ring.innerHTML = '<i class="fas ' + icon + '"></i>'; title.textContent = t; msg.textContent = m; }
  function ok() { show('ok', 'تم الدفع بنجاح ✓', 'استلمنا الدفع وتم تأكيده من البنك. هنبدأ تجهيز طلبك فوراً.', 'fa-check'); }
  function fail() { show('fail', 'لم تكتمل عملية الدفع', 'العملية اترفضت أو اتلغت. طلبك محفوظ — تواصل معنا أو جرّب تاني.', 'fa-xmark'); }
  function pending(final) {
    show('wait', 'الدفع قيد المراجعة', final ? 'لسه ماوصلناش تأكيد البنك. هنحدّث حالة طلبك أول ما يتأكد، وتقدر تتابعه من صفحة التتبع.'
      : 'لحظات من فضلك، بنستنى تأكيد البنك...', final ? 'fa-hourglass-half' : 'fa-spinner fa-spin');
  }

  if (!orderNum || !token) return pending(true);

  var tries = 0, MAX = 40; // ~2 minutes
  async function check() {
    tries++;
    try {
      if (!window.SB || !window.SB.client) { if (tries < MAX) return setTimeout(check, 1500); return pending(true); }
      var r = await window.SB.client.rpc('payment_status', { p_order_number: orderNum, p_token: token });
      var st = r && !r.error && r.data ? String(r.data.payment_status || '') : '';
      if (st === 'paid') return ok();
      if (st === 'failed' || st === 'canceled' || st === 'cancelled') return fail();
      if (tries >= MAX) return pending(true);
      pending(false);
      setTimeout(check, 3000);
    } catch (e) { if (tries < MAX) setTimeout(check, 3000); else pending(true); }
  }
  window.addEventListener('sb:ready', function () { if (tries === 0) check(); });
  setTimeout(function () { if (tries === 0) check(); }, 900);
})();
</script>
</body>
</html>
