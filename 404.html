<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - الصفحة غير موجودة | Beauty Life</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Arabic', 'Cairo', system-ui, sans-serif;
    background: linear-gradient(135deg, #0b1b3a 0%, #142a5c 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    direction: rtl;
  }
  .wrap { max-width: 560px; }
  .mini-brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px;text-decoration:none;color:#fff;}
  .mini-brand .logo-box{width:58px;height:58px;border-radius:16px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(0,0,0,.24);}
  .mini-brand img{width:100%;height:100%;object-fit:contain;display:block;}
  .mini-brand .brand-name{font-size:1.15rem;font-weight:900;}
  .mini-brand .brand-sub{font-size:.68rem;letter-spacing:1.3px;color:#dbe4f5;text-transform:uppercase;}
  .code {
    font-size: clamp(6rem, 20vw, 10rem);
    font-weight: 900;
    color: #d4af5a;
    line-height: 1;
    text-shadow: 0 6px 30px rgba(212,175,90,.35);
  }
  h1 { font-size: 1.6rem; margin: 12px 0 8px; font-weight: 800; }
  p  { opacity: .85; margin-bottom: 24px; line-height: 1.7; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 12px;
    background: #d4af5a; color: #0b1b3a; font-weight: 800;
    text-decoration: none; transition: transform .2s ease;
  }
  a.btn.alt { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.25); }
  a.btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="mini-brand" aria-label="Beauty Life Home">
      <span class="logo-box"><img src="assets/company-logo.png" alt="Beauty Life Logo"></span>
      <span>
        <span class="brand-name">Beauty Life</span><br>
        <span class="brand-sub">Medical Aesthetic</span>
      </span>
    </a>
    <div class="code">404</div>
    <h1>الصفحة اللي بتدوّري عليها مش موجودة</h1>
    <p>يمكن الرابط قديم أو الصفحة اتنقلت. ارجعي للرئيسية أو تصفّحي المتجر.</p>
    <div class="btns">
      <a href="index.html" class="btn"><i class="fas fa-house"></i> الرئيسية</a>
      <a href="store.html" class="btn alt"><i class="fas fa-bag-shopping"></i> المتجر</a>
    </div>
  </div>
</body>
</html>
